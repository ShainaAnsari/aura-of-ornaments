<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Cart</title>
</head>

<body>

    <header>
        <div class="logo invert">
            <a href="../index.html">
                <img src="../images/logo.svg" alt="Logo">
            </a>
        </div>
        <div class="menu">
            <a href="../index.html">Home</a>
            <a href="../product.html">Product</a>
            <a href="../services.html">Services</a>
            <a href="../aboutUs.html">About Us</a>
            <a href="../contactUs.html">Contact Us</a>
        </div>

        <div class="icons invert">
            <div class="user-wrapper" id="userWrapper">
                <img src="../images/user.svg" alt="user" id="userIcon">
                <div class="dropdown" id="userDropdown">
                    <ul class="locations">
                        <li><a href="../form/sign_in.html" id="signInOption">Sign In</a></li>
                        <li><a href="../form/sign_up.html" id="signUpOption">Sign Up</a></li>
                        <li><a href="#" id="logout">Log Out</a></li>
                    </ul>
                    <span id="userNameDisplay"></span>
                </div>
            </div>
            <a href="wishlist.html"><img src="../images/wishlist.svg" alt="wishlist"></a>
            <a href="cart.html"><img src="../images/cart.svg" alt="cart"></a>
        </div>

    </header>
    <!-- header section ends  -->

    <!-- Cart Section -->
    <div id="cart-section">
        <div class="section-style">
            <div class="cart-container">
                <h1>Shopping Cart</h1>

                <div class="cart-item">
                    <img src="../images/heart earrings.webp" alt="Jewelry Item">
                    <div class="item-details">
                        <h3>Heart-Shaped Earrings</h3>
                        <h5>Price: Rs.799</h5>
                    </div>
                    <div class="quantity-container">
                        <!-- <label for="quantity">Quantity</label> -->
                        <div class="quantity-box">
                            <button id="decrease">-</button>
                            <input type="text" id="quantity" value="1" readonly>
                            <button id="increase">+</button>
                        </div>
                    </div>
                    <button class="remove-btn">Remove</button>
                </div>

                <div class="cart-item">
                    <img src="../images/product13.webp" alt="Jewelry Item">
                    <div class="item-details">
                        <h3>Triangle Pearl Earring</h3>
                        <h5>Price: Rs.499</h5>
                    </div>
                    <div class="quantity-container">
                        <!-- <label for="quantity">Quantity</label> -->
                        <div class="quantity-box">
                            <button id="decrease">-</button>
                            <input type="text" id="quantity" value="1" readonly>
                            <button id="increase">+</button>
                        </div>
                    </div>
                    <button class="remove-btn">Remove</button>
                </div>

                <div class="cart-item">
                    <img src="../images/product14.webp" alt="Jewelry Item">
                    <div class="item-details">
                        <h3>Elegant Diamond Ring</h3>
                        <h5>Price: Rs.900</h5>
                    </div>
                    <div class="quantity-container">
                        <!-- <label for="quantity">Quantity</label> -->
                        <div class="quantity-box">
                            <button id="decrease">-</button>
                            <input type="text" id="quantity" value="1" readonly>
                            <button id="increase">+</button>
                        </div>
                    </div>
                    <button class="remove-btn">Remove</button>
                </div>

                <button class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script src="../JavaScript/script.js"></script>

</body>

</html>
