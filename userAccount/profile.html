<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | User Profile</title>
</head>

<body>
    <section class="userProfile-section">
        <div class="section-style">
            <div class="userProfile-container">
                <h1>User Profile</h1>
                <form id="userProfileForm" class="userProfile-form">
                    <label for="userProfile-name">Full Name</label>
                    <input type="text" id="userProfile-name" class="userProfile-input" name="name" required>

                    <label for="userProfile-email">Email</label>
                    <input type="email" id="userProfile-email" class="userProfile-input" name="email" required>

                    <label for="userProfile-phone">Phone Number</label>
                    <input type="tel" id="userProfile-phone" class="userProfile-input" name="phone" required>

                    <label for="userProfile-address">Address</label>
                    <textarea id="userProfile-address" class="userProfile-input" name="address" rows="3" required></textarea>

                    <button type="button" id="userProfile-editBtn" class="userProfile-btn">Edit</button>
                </form>
            </div>
        </div>
    </section>
    <script src="../JavaScript/script.js"></script>
</body>

</html>
