<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Shipping</title>
</head>

<body>
    <div id="shipping-section">
        <div class="section-style">
            <div class="shipping-border">
                <h1>Shipping Details</h1>
                <div class="shipping-container">
                    <div class="shipping-form-container">
                        <form>
                            <div class="shipping-form-group">
                                <label for="name">Full Name</label>
                                <input type="text" id="name" required>
                            </div>
                            <div class="shipping-form-group">
                                <label for="phone">Phone Number</label>
                                <input type="text" id="phone" required>
                            </div>
                            <div class="shipping-form-group">
                                <label for="address">Address</label>
                                <input type="text" id="address" required>
                            </div>
                            <div class="shipping-form-group input-group">
                                <div class="input-box">
                                    <label for="city">City</label>
                                    <input type="text" id="city" name="city" required>
                                </div>
                                <div class="input-box">
                                    <label for="state">State</label>
                                    <input type="text" id="state" name="state" required>
                                </div>
                            </div>

                            <div class="shipping-form-group">
                                <label for="zip">ZIP Code</label>
                                <input type="text" id="zip" required>
                            </div>
                            <button type="submit" class="submit-btn">Proceed to Payment</button>
                        </form>
                    </div>
                    <div class="summary-container">
                        <h3>Order Summary</h3>
                        <div class="summary-item">
                            <img src="../images/heart earrings.webp" alt="Product Image">
                            <div class="details">
                                <h3>Heart-Shaped Earrings</h3>
                                <p>Qty: 1</p>
                            </div>
                            <p class="price">Rs.799</p>
                        </div>
                        <div class="summary-item">
                            <img src="../images/product13.webp" alt="Product Image">
                            <div class="details">
                                <h3>Triangle Pearl Earring</h3>
                                <p>Qty: 1</p>
                            </div>
                            <p class="price">Rs.499</p>
                        </div>
                        <div class="summary-item">
                            <img src="../images/product14.webp" alt="Product Image">
                            <div class="details">
                                <h3>Elegant Diamond Ring</h3>
                                <p>Qty: 1</p>
                            </div>
                            <p class="price">Rs.900</p>
                        </div>
                        <div class="total-price">
                            <p><strong>Subtotal:</strong> Rs.2198</p>
                            <p><strong>Shipping:</strong> Rs.99</p>
                            <p><strong>Total:</strong> Rs.2297</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../JavaScript/script.js"></script>

</body>

</html>
