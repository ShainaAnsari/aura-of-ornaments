<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/utility.css">
    <title>Aura Of Ornaments | Wishlist</title>
</head>

<body>

    <header>
        <div class="logo invert">
            <a href="../index.html">
                <img src="../images/logo.svg" alt="Logo">
            </a>
        </div>
        <div class="menu">
            <a href="../index.html">Home</a>
            <a href="../product.html">Product</a>
            <a href="../services.html">Services</a>
            <a href="../aboutUs.html">About Us</a>
            <a href="../contactUs.html">Contact Us</a>
        </div>

        <div class="icons invert">
            <div class="user-wrapper" id="userWrapper">
                <img src="../images/user.svg" alt="user" id="userIcon">
                <div class="dropdown" id="userDropdown">
                    <ul class="locations">
                        <li><a href="../form/sign_in.html" id="signInOption">Sign In</a></li>
                        <li><a href="../form/sign_up.html" id="signUpOption">Sign Up</a></li>
                        <li><a href="#" id="logout">Log Out</a></li>
                    </ul>
                    <span id="userNameDisplay"></span>

            </div>
            <a href="wishlist.html"><img src="../images/red-heart.svg" alt="wishlist" class="invert bigger"></a>
            <a href="cart.html"><img src="../images/cart.svg" alt="cart"></a>
        </div>

    </header>
    <!-- header section ends  -->

    <!-- Products section -->
    <div id="product">

            <h2 class="wishlist-title">My Wishlist</h2>
            <div class="product-container">
                <div class="product-cards">
                    <div class="product-img">

                        <span class="wishlist-icon">
                            <img src="../images/red-heart.svg" alt="Wishlist Icon" class="wishlist-img">

                    <div class="product-content">
                        <h4>Ring</h4>
                        <h3>Millie Ring</h3>
                        <h5>Rs.400</h5>

                            <a href="#">Add to cart</a>

                </div>

                <div class="product-cards">
                    <div class="product-img">
                        <!-- Wishlist Icon in the Top-Right Corner -->

                            <img src="../images/red-heart.svg" alt="Wishlist Icon" class="wishlist-img">
                        </span>

                    <div class="product-content">
                        <h4>Earring</h4>
                        <h3>Red Heart Earring</h3>
                        <h5>Rs.599</h5>
                        <div class="btn">
                            <a href="#">Add to cart</a>

                    </div>
                </div>

                <div class="product-cards">
                    <div class="product-img">
                        <!-- Wishlist Icon in the Top-Right Corner -->

                            <img src="../images/red-heart.svg" alt="Wishlist Icon" class="wishlist-img">

                    <div class="product-content">
                        <h4>Neckwear</h4>
                        <h3>Blue Heart Stone Pendant</h3>
                        <h5>Rs.599</h5>
                        <div class="btn">
                            <a href="#">Add to cart</a>
                        </div>
                    </div>
                </div>

                <div class="product-cards">
                    <div class="product-img">
                        <!-- Wishlist Icon in the Top-Right Corner -->
                        <span class="wishlist-icon">
                            <img src="../images/red-heart.svg" alt="Wishlist Icon" class="wishlist-img">
                        </span>
                        <img src="../images/gold pin earring.webp" alt="">
                    </div>
                    <div class="product-content">
                        <h4>Earring</h4>
                        <h3>Gold Hoops Earring</h3>
                        <h5>Rs.599</h5>
                        <div class="btn">
                            <a href="#">Add to cart</a>
